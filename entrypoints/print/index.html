<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting notes</title>
    <style>
      body { margin: 0; background: #fff; color: #111114; font-family: system-ui, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 40px 32px; }
      h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
      .meta { margin: 0 0 24px; font-size: 13px; color: #6e7079; }
      h2 { margin: 24px 0 8px; font-size: 15px; break-after: avoid; }
      p, li { font-size: 14px; line-height: 1.55; }
      p { margin: 0 0 8px; }
      ul { margin: 0; padding-left: 20px; }
      li { break-inside: avoid; margin-bottom: 4px; }
      .status { color: #6e7079; font-size: 14px; }
      @media print { main { padding: 0; max-width: none; } }
    </style>
  </head>
  <body>
    <main id="doc"><p class="status" role="status">Preparing your document…</p></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
