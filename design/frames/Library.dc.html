<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meetings library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4F46E5}a:hover{color:#3730A3}
</style>
</helmet>
<div style="width: 400px; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #F6F6F7; color: #111114; font-family: Geist, system-ui, sans-serif;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 0;">
    <a href="Start.dc.html" aria-label="Back to home" style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #111114;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">Meetings</h1>
    <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #6E7079;">24 saved</span>
  </header>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E8E8EB;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E7079" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search meetings</label>
      <input id="q" type="search" placeholder="Search every meeting" style="flex-grow: 1; height: 40px; border: none; background: transparent; font: inherit; font-size: 14px; color: #111114; outline: none;">
    </div>
    <div role="group" aria-label="Filter" style="display: flex; gap: 6px;">
      <button type="button" aria-pressed="true" style="height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: #111114; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600;">All</button>
      <button type="button" aria-pressed="false" style="height: 30px; padding: 0 12px; border: none; border-radius: 999px; background: #EBEBEE; color: #2A2B31; font: inherit; font-size: 12px; font-weight: 500;">Open actions · 5</button>
    </div>
  </div>

  <section style="flex-grow: 1; overflow: hidden; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 8px;">
    <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 600; color: #6E7079;">This week</h2>
    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E8EB;">
      <a href="Live.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; text-decoration: none; color: #111114;"><span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-size: 15px; font-weight: 600;">Weekly product sync</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6E7079;">Now</span></span><span style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 8px; border-radius: 999px; background: #E3E2FF; color: #3730A3; font-size: 11px; font-weight: 600;">Recording</span></span></a>
    </div>
    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E8EB;">
      <a href="Summary.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; text-decoration: none; color: #111114;"><span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-size: 15px; font-weight: 600;">Client onboarding call</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6E7079;">Oct 27</span></span><span style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="padding: 3px 8px; border-radius: 999px; background: #F1F1F3; color: #44464D; font-size: 11px; font-weight: 500;">45 min</span></span></a>
      <div role="alertdialog" aria-label="Delete Client onboarding call" style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid #E8E8EB; font-size: 13px;">
        <span style="flex-basis: 100%;">Delete this meeting for good?</span>
        <button type="button" style="height: 36px; padding: 0 16px; border-radius: 12px; border: 1px solid #E8E8EB; background: #FFFFFF; color: #111114; font: inherit; font-size: 13px; font-weight: 600;">Cancel</button>
        <button type="button" style="height: 36px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent; background: #111114; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600;">Delete</button>
      </div>
    </div>
    <h2 style="margin: 10px 0 0; padding: 0 4px; font-size: 12px; font-weight: 600; color: #6E7079;">Earlier</h2>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E8EB;">
      <div style="display: flex; align-items: flex-start; gap: 8px;">
        <a href="Summary.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #111114;"><span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-size: 15px; font-weight: 600;">Design review</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6E7079;">Oct 26</span></span><span style="font-size: 13px; line-height: 1.45; color: #5F6168;">New onboarding flow approved with two copy changes.</span></a>
        <button type="button" aria-label="Delete Design review" style="width: 32px; height: 32px; flex-shrink: 0; border: none; border-radius: 9px; background: transparent; color: #6E7079; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
      </div>
      <span style="display: flex; gap: 6px;"><span style="padding: 3px 8px; border-radius: 999px; background: #E8F5EE; color: #1A6B40; font-size: 11px; font-weight: 600;">All done</span><span style="padding: 3px 8px; border-radius: 999px; background: #F1F1F3; color: #44464D; font-size: 11px; font-weight: 500;">28 min</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8E8EB;">
      <div style="display: flex; align-items: flex-start; gap: 8px;">
        <a href="Summary.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #111114;"><span style="display: flex; justify-content: space-between; gap: 8px;"><span style="font-size: 15px; font-weight: 600;">1:1 with Sam</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6E7079;">Oct 21</span></span><span style="font-size: 13px; line-height: 1.45; color: #5F6168;">Career goals and the Q1 hiring plan.</span></a>
        <button type="button" aria-label="Delete 1:1 with Sam" style="width: 32px; height: 32px; flex-shrink: 0; border: none; border-radius: 9px; background: transparent; color: #6E7079; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
      </div>
      <span style="display: flex; gap: 6px;"><span style="padding: 3px 8px; border-radius: 999px; background: #F1F1F3; color: #44464D; font-size: 11px; font-weight: 500;">31 min</span></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
