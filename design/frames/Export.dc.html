        <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: #F6F6F7; font-size: 14px; font-weight: 500;"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #4F46E5;">Action items</label>

      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="padding: 0 0 8px; font-size: 12px; font-weight: 600; color: #6E7079;">Send to</span>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; border: none; border-radius: 12px; background: transparent; font: inherit; color: #111114; text-align: left;">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEF0FF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M4 16V6a2 2 0 0 1 2-2h10"></path></svg></span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 500;">Copy as Markdown</span><span style="font-size: 12px; color: #6E7079;">Paste into Slack, Notion or a doc</span></span>

      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; border: none; border-radius: 12px; background: transparent; font: inherit; color: #111114; text-align: left;">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEF0FF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></span>

      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; border: none; border-radius: 12px; background: transparent; font: inherit; color: #111114; text-align: left;">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEF0FF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>

      </button>
    </div>

    <button type="button" style="height: 50px; border: none; border-radius: 14px; background: #111114; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600;">Copy to clipboard</button>
